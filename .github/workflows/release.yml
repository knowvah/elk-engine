# SPDX-License-Identifier: EPL-2.0
name: Release

# semantic-release: analyze the Conventional Commits on main since the last
# `v<version>` tag and, when there is a releasable change, publish to npm via
# OIDC trusted publishing (no NPM_TOKEN), push the `v<version>` git tag, and
# create a GitHub Release with the generated notes. It does NOT commit a
# changelog or version back to main (main requires signed commits); the
# changelog lives in the GitHub Release.
#
# Runs on every push to main, and by hand for a retry. 1.0.0 was published by hand (2026-11-23,
# PUBLISHING.md) and the `v1.0.0` tag marks it, so semantic-release computes the
# next version from the commits after that tag. A merge with no releasable
# commit (docs, chore, ci, test, refactor) publishes nothing.
#
# A run needs the trusted publisher on npmjs.com (below); without it the publish
# step fails, and nothing else is changed by that failure.
#
# The trusted publisher on npmjs.com is pinned to THIS workflow file
# (release.yml) and the "release" environment, so keep both names stable.
on:
  push:
    branches: [main]
  workflow_dispatch: # a manual retry of a failed run

concurrency: release-${{ github.ref }}

jobs:
  release:
    # Releases are cut from main only, whatever ref a dispatch names.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the git tag + create the GitHub Release
      issues: write # semantic-release release comments
      pull-requests: write # semantic-release release comments
      id-token: write # OIDC trusted publishing + provenance
      packages: write # mirror the release to GitHub Packages (see below)
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 26 bundles a
      # newer npm; fail early if a runner image ever ships an older one,
      # instead of installing an unpinned `npm@latest` into a release job.
      - name: Require npm >= 11.5.1
        run: |
          set -euo pipefail
          version="$(npm --version)"
          echo "npm $version"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            process.exit(ok ? 0 : 1);
          ' "$version"

      # `@knowvah/*` installs from GitHub Packages (see .npmrc), but setup-node
      # above points at npmjs for OIDC publishing and can hold only one
      # registry-url, so add the GitHub Packages read auth separately.
      # package.json's publishConfig (`registry` for semantic-release, and
      # `@knowvah:registry`, which npm prefers over any --registry) keeps
      # the release publishing to npmjs despite the .npmrc scope mapping.
      - name: Authenticate to GitHub Packages
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm config set //npm.pkg.github.com/:_authToken "$GH_PACKAGES_TOKEN"
      - run: npm ci

      - run: npm run typecheck

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror the release to GitHub Packages, as knowvah/dot-engine does.
      #
      # Why: a scope maps to ONE registry, so a consumer that needs the private
      # @knowvah/theme (GitHub Packages) has to point @knowvah there and would
      # otherwise have to name this package by full tarball URL. Publishing
      # here too lets those consumers use an ordinary version range.
      #
      # npmjs stays primary: semantic-release publishes first, with provenance,
      # and this runs after it, so a failure here cannot affect that. GitHub
      # Packages supports neither OIDC nor provenance; GITHUB_TOKEN authenticates.
      #
      # `@semantic-release/npm` writes the new version into the working copy's
      # package.json (it is not committed back), so an unchanged
      # 0.0.0-development means no release was cut and there is nothing to
      # mirror. dist/ is already built, by the prepublishOnly that
      # semantic-release's own publish ran.
      - name: Mirror to GitHub Packages
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "0.0.0-development" ]; then
            echo "No release was cut; nothing to mirror."
            exit 0
          fi
          registry=https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken "$GH_PACKAGES_TOKEN"
          if npm view --registry "$registry" "@knowvah/elk-engine@$version" version >/dev/null 2>&1; then
            echo "@knowvah/elk-engine@$version already on GitHub Packages, skipping"
            exit 0
          fi
          tgz="$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          echo "==> mirroring $RUNNER_TEMP/$tgz"
          # .npmrc maps @knowvah to GitHub Packages and package.json's
          # publishConfig pins `@knowvah:registry` to npmjs; npm picks a scope
          # registry over --registry, so the scope key is what selects here.
          npm publish "$RUNNER_TEMP/$tgz" "--@knowvah:registry=$registry" --access public
