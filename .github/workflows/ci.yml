# SPDX-License-Identifier: EPL-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege GITHUB_TOKEN; the job only reads the repo and the @knowvah
# packages on GitHub Packages (see .npmrc).
permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          # Two lockfiles: the root, and the isolated TypeScript 6 package that
          # `npm run docs:api` installs for typedoc (tools/typedoc/README.md).
          cache-dependency-path: |
            package-lock.json
            tools/typedoc/package-lock.json
          # Writes the npm.pkg.github.com auth line so `@knowvah/*` (the docs
          # theme is on GitHub Packages only) resolves; the scope mapping
          # itself is in the repo's .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@knowvah'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format:check
      - run: npm run typecheck
      # lizard for `npm run complexity` and test/architecture/complexity-check.test.ts
      # (which skips without it). Pinned: the tool's fallbacks and fixtures are
      # calibrated to 1.22.2's blind spots. pipx avoids Ubuntu's PEP 668 block on
      # system-wide pip installs.
      - run: pipx install lizard==1.22.2
      # Measures every TypeScript function in src/ (plain lizard silently skips some).
      - run: npm run complexity
      # `coverage` = tools/coverage-gate/run.sh around `vitest run --coverage`: same
      # suite as `npm test`, plus the vitest.config.ts coverage thresholds and a
      # Cobertura report; the full output is kept in coverage-logs/. The suite
      # includes the documentation examples (test/docs/examples.test.ts), which
      # must equal their oracle refs.
      - run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: coverage-log
          path: coverage-logs/
          retention-days: 7
      # Release rehearsal; publishes nothing and contacts no registry (PUBLISHING.md).
      # `publish:check` = typecheck, build, `npm pack --dry-run`: the build and
      # the file list of the tarball stay valid.
      - run: npm run publish:check
      # Packs the tarball, checks its file list (required files present, no
      # tests, plans or docs), installs it offline into a clean project and
      # imports it by package name.
      - run: npm run pack:smoke
      # The same with the proposed entry module bundled as `build:js` would
      # bundle it: the clean project lays out a documentation example and the
      # result must equal its oracle ref. Guards the entry's import order
      # inside a bundle. Drop this step once src/index.ts holds the accepted
      # surface (docs/architecture/public-api.md, "On acceptance").
      - run: npm run pack:smoke -- --entry test/public-api/candidate-index.ts
      # PR gate for the docs site: locale completeness, dead links, and the
      # generated showcase and parity pages all fail the build. `docs:build`
      # runs `docs:api` first: it installs tools/typedoc (TypeScript 6, for
      # typedoc only) and generates the API reference; a typedoc error fails it.
      - run: npm run docs:build
      # Internal links and fragments of the built site (linkinator). VitePress
      # itself checks neither nav links nor anchors. External links are checked
      # weekly by links.yml, never here.
      - run: npm run docs:linkcheck
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: cobertura-report
          path: coverage/cobertura-coverage.xml
          retention-days: 7

  # Publishes line coverage to GitHub Code Quality (PR comment + default-branch
  # baseline). Kept in its own job so code-quality:write is never exposed to
  # the job that runs npm ci / third-party install scripts. Fork PRs are skipped
  # because they cannot receive a write token. Mirrors knowvah/dot-engine.
  upload-coverage:
    needs: ci
    if: ${{ !cancelled() && needs.ci.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cobertura-report
      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
