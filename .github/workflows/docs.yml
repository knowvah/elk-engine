# SPDX-License-Identifier: EPL-2.0
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write
  # `@knowvah/*` installs from GitHub Packages; see .npmrc.
  packages: read

# Allow one concurrent deployment; skip runs queued behind a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs so the Pages deploy token (pages: write,
  # id-token: write) never shares a runner with `npm ci` and its third-party
  # install scripts. The build job only hands over the static artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          # Writes the npm.pkg.github.com auth line so `@knowvah/*` (the docs
          # theme is on GitHub Packages only) resolves; the scope mapping
          # itself is in the repo's .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@knowvah'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  # A failed deploy leaves the previous deployment live; re-run the job or
  # dispatch the workflow once the cause is fixed.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
